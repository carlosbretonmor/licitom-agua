# licitom AGUA · actualización diaria y publicación en GitHub Pages

name: Actualizar licitaciones

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar la aplicación
        run: |
          echo "Archivos presentes en el repositorio:"
          ls -lah

          if [ ! -f licitom_AGUA.html ]; then
            echo "::error::No existe licitom_AGUA.html en la raíz del repositorio."
            exit 1
          fi

          echo "Tamaño de licitom_AGUA.html:"
          wc -c licitom_AGUA.html

          echo "Primeras líneas del HTML:"
          head -n 5 licitom_AGUA.html

      - name: Descargar y filtrar licitaciones del agua
        id: datos
        run: |
          set +e

          mkdir -p _site

          # La aplicación principal de GitHub Pages tiene que llamarse index.html
          cp licitom_AGUA.html _site/index.html

          # Copia opcional del README
          if [ -f README.md ]; then
            cp README.md _site/README.md
          fi

          echo "Tamaño de index.html antes de publicar:"
          wc -c _site/index.html

          echo "Primeras líneas de index.html:"
          head -n 5 _site/index.html

          python scripts/actualizar_licitaciones.py \
            --salida _site/datos \
            --previo "${{ steps.pages.outputs.base_url }}/datos/"

          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

          echo "Contenido final que se va a publicar:"
          find _site -maxdepth 2 -type f -print

          echo "Tamaño final de index.html:"
          wc -c _site/index.html

          exit 0

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar la web
        id: despliegue
        uses: actions/deploy-pages@v4

      - name: Avisar si alguna fuente oficial falló
        if: steps.datos.outputs.rc != '0'
        run: |
          echo "::warning::Alguna fuente oficial no se pudo leer correctamente."
          echo "::warning::La aplicación se ha publicado, pero revisa el paso 'Descargar y filtrar licitaciones del agua'."
