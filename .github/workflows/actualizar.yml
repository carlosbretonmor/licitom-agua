# licitom AGUA · actualización diaria automática
# Cada mañana descarga las novedades oficiales de la Plataforma de Contratación del Sector Público,
# filtra las licitaciones del ciclo integral del agua y publica la web (GitHub Pages) con los datos.
# Quien abra el enlace de la web recibe las novedades automáticamente, sin descargar nada.

name: Actualizar licitaciones

on:
  schedule:
    - cron: "30 5 * * *"     # todos los días a las 05:30 UTC (06:30 en invierno / 07:30 en verano, hora peninsular)
  workflow_dispatch:          # botón «Run workflow» para lanzarlo a mano
  push:
    branches: [main]          # al subir una versión nueva de la app, se publica al momento

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y filtrar licitaciones del agua
        id: datos
        run: |
          set +e
          mkdir -p _site
          cp *.html *.md _site/ 2>/dev/null
          if [ -f licitom_AGUA.html ]; then cp licitom_AGUA.html _site/index.html; fi
          python scripts/actualizar_licitaciones.py --salida _site/datos --previo "${{ steps.pages.outputs.base_url }}/datos/"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Preparar la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar la web
        id: despliegue
        uses: actions/deploy-pages@v4

      - name: Avisar si alguna fuente oficial falló
        if: steps.datos.outputs.rc != '0'
        run: |
          echo "::error::No se pudo leer alguna fuente oficial. Se han mantenido los datos anteriores. Revisa el registro del paso «Descargar y filtrar»."
          exit 1
